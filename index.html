<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Base Token Scanner Pro</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,Arial,sans-serif;
}

body{
  background:
  radial-gradient(circle at top left,#172554 0%,#020617 45%,#000 100%);
  min-height:100vh;
  color:white;
  padding:24px;
}

.wrap{
  max-width:1400px;
  margin:auto;
}

.hero{
  margin-bottom:28px;
}

.hero h1{
  font-size:48px;
  font-weight:900;
  letter-spacing:-2px;
  margin-bottom:10px;
}

.hero p{
  color:#94a3b8;
}

.glass{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(20px);
  border-radius:28px;
  box-shadow:
  0 10px 40px rgba(0,0,0,.45),
  inset 0 1px 0 rgba(255,255,255,.08);
}

.scan-box{
  padding:24px;
  margin-bottom:24px;
}

.input-row{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

input{
  flex:1;
  min-width:280px;
  height:64px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);
  color:white;
  padding:0 20px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#3b82f6;
  box-shadow:0 0 0 4px rgba(59,130,246,.15);
}

button{
  height:64px;
  padding:0 34px;
  border:none;
  border-radius:20px;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:white;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
}

button:disabled{
  opacity:.6;
}

.err{
  margin-top:18px;
  padding:16px;
  border-radius:18px;
  background:rgba(239,68,68,.15);
  border:1px solid rgba(239,68,68,.3);
  display:none;
}

.progress{
  padding:24px;
  display:none;
  margin-bottom:24px;
}

.step-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.step{
  padding:16px;
  border-radius:18px;
  display:flex;
  align-items:center;
  gap:14px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
}

.step.running{border-color:#3b82f6;}
.step.done{border-color:#10b981;}
.step.err{border-color:#ef4444;}

.step-ic{
  width:36px;
  height:36px;
  border-radius:12px;
  background:rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

.results{
  display:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:18px;
}

.card{
  padding:24px;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
}

.label{
  color:#94a3b8;
  font-size:13px;
  margin-bottom:12px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.value{
  font-size:28px;
  font-weight:900;
  line-height:1.1;
  word-break:break-word;
}

.small{
  margin-top:10px;
  font-size:14px;
  color:#cbd5e1;
}

.section{
  margin-top:28px;
}

.section h2{
  margin-bottom:18px;
  font-size:26px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:10px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
}

.green{
  background:rgba(16,185,129,.16);
  color:#6ee7b7;
}

.red{
  background:rgba(239,68,68,.16);
  color:#fca5a5;
}

.yellow{
  background:rgba(245,158,11,.16);
  color:#fcd34d;
}

.holders{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.holder{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
  border-radius:16px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
}

.addr{
  font-family:monospace;
  color:#cbd5e1;
}

.footer{
  margin-top:40px;
  text-align:center;
  color:#64748b;
  font-size:13px;
}

@media(max-width:700px){
  .hero h1{
    font-size:34px;
  }

  button{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="hero">
    <h1>Base Token Scanner Pro</h1>
    <p>
      Advanced scanner untuk token Base network.
      Detect honeypot, liquidity, holder concentration,
      mint risk, blacklist, proxy contract, dan Clanker token.
    </p>
  </div>

  <div class="glass scan-box">

    <div class="input-row">

      <input
      id="addrIn"
      type="text"
      placeholder="0x... contract address"
      />

      <button id="scanBtn" onclick="startScan()">
        Scan Token
      </button>

    </div>

    <div class="err" id="errBox"></div>

  </div>

  <div class="glass progress" id="prog">
    <h3 style="margin-bottom:18px;">Scanning Progress</h3>
    <div class="step-list" id="stepList"></div>
  </div>

  <div class="results" id="results"></div>

  <div class="footer">
    Powered by Base • Alchemy • DexScreener • GoPlus • Blockscout
  </div>

</div>

<script>

const ALCHEMY_RPC_URL = 'https://base-mainnet.g.alchemy.com/v2/demo';
const PUBLIC_RPC_URL = 'https://mainnet.base.org';
const BASE_RPC = ALCHEMY_RPC_URL || PUBLIC_RPC_URL;
const BASE_CHAIN_ID = '8453';

const SELECTORS = {
  totalSupply:'0x18160ddd',
  name:'0x06fdde03',
  symbol:'0x95d89b41',
  decimals:'0x313ce567',
  owner:'0x8da5cb5b',
  isVerified:'0x893d20e8'
};

let stepElements = {};
let lastScanResult = null;

function fmtNum(n){
  if(!n||isNaN(n)) return '0';

  if(n>=1e12) return (n/1e12).toFixed(2)+'T';
  if(n>=1e9) return (n/1e9).toFixed(2)+'B';
  if(n>=1e6) return (n/1e6).toFixed(2)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';

  return Number(n).toFixed(2);
}

function fmtPrice(p){
  if(!p) return 'N/A';

  const n = parseFloat(p);

  if(n < 0.000001) return '$'+n.toExponential(4);
  if(n < 0.01) return '$'+n.toFixed(8);
  if(n < 1) return '$'+n.toFixed(6);

  return '$'+n.toFixed(4);
}

function fmtAge(timestamp){
  const diff = Date.now() - timestamp;
  const mins = Math.floor(diff/60000);
  const hrs = Math.floor(diff/3600000);
  const days = Math.floor(diff/86400000);

  if(mins < 1) return 'Baru saja';
  if(mins < 60) return mins+' menit lalu';
  if(hrs < 24) return hrs+' jam lalu';
  return days+' hari lalu';
}

function decodeUint256(hex){
  if(!hex||hex==='0x') return 0n;
  try{return BigInt(hex)}catch{return 0n}
}

function decodeAddress(hex){
  if(!hex||hex.length<42) return null;
  return '0x'+hex.slice(-40).toLowerCase();
}

function decodeBool(hex){
  if(!hex||hex==='0x') return false;
  return hex.slice(-1)==='1';
}

function decodeString(hex){
  try{
    if(!hex||hex==='0x') return '';

    const raw = hex.startsWith('0x')
      ? hex.slice(2)
      : hex;

    let out='';

    for(let i=0;i<64;i+=2){
      const code=parseInt(raw.substr(i,2),16);
      if(code) out+=String.fromCharCode(code);
    }

    return out;

  }catch{
    return '';
  }
}

async function rpcBatch(calls){

  try{

    const body = JSON.stringify(
      calls.map((c,i)=>(
        {
          jsonrpc:'2.0',
          method:'eth_call',
          params:[{to:c.to,data:c.data},'latest'],
          id:i+1
        }
      ))
    );

    const res = await fetch(BASE_RPC,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body
    });

    const json = await res.json();

    return json.map(r=>r.result||null);

  }catch(err){

    console.warn(err);
    return calls.map(()=>null);

  }
}

async function readTokenBasics(addr){

  const calls=[
    {to:addr,data:SELECTORS.totalSupply},
    {to:addr,data:SELECTORS.owner},
    {to:addr,data:SELECTORS.isVerified},
    {to:addr,data:SELECTORS.decimals},
    {to:addr,data:SELECTORS.name},
    {to:addr,data:SELECTORS.symbol},
  ];

  const [
    supplyHex,
    ownerHex,
    verifiedHex,
    decimalsHex,
    nameHex,
    symbolHex
  ] = await rpcBatch(calls);

  return {
    totalSupply:decodeUint256(supplyHex),
    owner:decodeAddress(ownerHex),
    isVerified:decodeBool(verifiedHex),
    decimals:decimalsHex ? parseInt(decimalsHex,16) : 18,
    name:decodeString(nameHex),
    symbol:decodeString(symbolHex)
  };
}

async function fetchDexScreener(addr){

  try{

    const url=`https://api.dexscreener.com/latest/dex/tokens/${addr}`;

    const res = await fetch(url);

    const json = await res.json();

    const pairs = json?.pairs || [];

    return pairs.filter(
      p=>p.chainId==='base'||p.chainId==='8453'
    );

  }catch{

    return null;

  }
}

async function fetchGoPlus(addr){

  try{

    const url=`https://api.gopluslabs.io/api/v1/token_security/${BASE_CHAIN_ID}?contract_addresses=${addr}`;

    const res = await fetch(url);

    const json = await res.json();

    return json?.result?.[addr.toLowerCase()] || null;

  }catch{

    return null;

  }
}

async function fetchHolders(addr){

  try{

    const url=`https://base.blockscout.com/api/v2/tokens/${addr}/holders?limit=10`;

    const res = await fetch(url);

    const json = await res.json();

    return json?.items || [];

  }catch{

    return [];

  }
}

function addStepUI(id,label){

  const list=document.getElementById('stepList');

  const div=document.createElement('div');

  div.className='step';

  div.id='s_'+id;

  div.innerHTML=`
    <div class="step-ic">○</div>
    <span>${label}</span>
  `;

  list.appendChild(div);

  stepElements[id]=div;
}

function setStepUI(id,state,detailText){

  const el=stepElements[id];

  if(!el) return;

  el.className='step '+state;

  const iconMap={
    running:'↻',
    done:'✓',
    err:'✕'
  };

  el.querySelector('.step-ic').textContent=
  iconMap[state]||'○';

  if(detailText){

    const span=el.querySelector('span');

    span.textContent=detailText;
  }
}

function showErrorBox(msg){

  const el=document.getElementById('errBox');

  el.style.display='block';

  el.innerHTML='⚠ '+msg;

  document.getElementById('prog').style.display='none';

  document.getElementById('scanBtn').disabled=false;
}

async function startScan(){

  const raw=document.getElementById('addrIn').value.trim();

  if(!/^0x[0-9a-fA-F]{40}$/.test(raw)){

    showErrorBox('Format contract tidak valid');

    return;
  }

  const CONTRACT=raw.toLowerCase();

  document.getElementById('errBox').style.display='none';
  document.getElementById('results').style.display='none';
  document.getElementById('results').innerHTML='';
  document.getElementById('prog').style.display='block';
  document.getElementById('stepList').innerHTML='';

  document.getElementById('scanBtn').disabled=true;

  addStepUI('rpc','Reading contract');
  addStepUI('dex','DexScreener');
  addStepUI('goplus','GoPlus Security');
  addStepUI('holders','Top holders');

  try{

    setStepUI('rpc','running');
    const basics=await readTokenBasics(CONTRACT);
    setStepUI('rpc','done');

    setStepUI('dex','running');
    const pairs=await fetchDexScreener(CONTRACT);
    setStepUI('dex','done');

    setStepUI('goplus','running');
    const goplus=await fetchGoPlus(CONTRACT);
    setStepUI('goplus','done');

    setStepUI('holders','running');
    const holders=await fetchHolders(CONTRACT);
    setStepUI('holders','done');

    renderResults({
      basics,
      pairs,
      goplus,
      holders,
      contract:CONTRACT
    });

  }catch(err){

    console.error(err);

    showErrorBox(err.message||'Scan gagal');

  }

  document.getElementById('scanBtn').disabled=false;
}

function renderResults(data){

  const {
    basics,
    pairs,
    goplus,
    holders
  } = data;

  const pair=pairs?.[0];

  const riskScore = (
    (goplus?.is_honeypot==='1'?50:0)+
    (goplus?.is_mintable==='1'?20:0)+
    (goplus?.is_proxy==='1'?15:0)+
    (goplus?.is_blacklisted==='1'?15:0)
  );

  let riskBadge='SAFE';
  let riskClass='green';

  if(riskScore>=50){
    riskBadge='HIGH RISK';
    riskClass='red';
  }
  else if(riskScore>=20){
    riskBadge='MEDIUM RISK';
    riskClass='yellow';
  }

  const html=`

  <div class="grid">

    <div class="glass card">
      <div class="label">Token</div>
      <div class="value">${basics.name||'Unknown'}</div>
      <div class="small">${basics.symbol||'-'}</div>
    </div>

    <div class="glass card">
      <div class="label">Price</div>
      <div class="value">${fmtPrice(pair?.priceUsd)}</div>
    </div>

    <div class="glass card">
      <div class="label">Liquidity</div>
      <div class="value">$${fmtNum(pair?.liquidity?.usd||0)}</div>
    </div>

    <div class="glass card">
      <div class="label">Market Cap</div>
      <div class="value">$${fmtNum(pair?.marketCap||0)}</div>
    </div>

    <div class="glass card">
      <div class="label">Pair Age</div>
      <div class="value">
      ${pair?.pairCreatedAt ? fmtAge(pair.pairCreatedAt) : 'N/A'}
      </div>
    </div>

    <div class="glass card">
      <div class="label">Risk</div>
      <div style="margin-top:10px;">
        <div class="badge ${riskClass}">
          ${riskBadge}
        </div>
      </div>
    </div>

  </div>

  <div class="section">

    <h2>Security Analysis</h2>

    <div class="grid">

      <div class="glass card">
        <div class="label">Honeypot</div>
        ${
          goplus?.is_honeypot==='1'
          ? '<div class="badge red">YES</div>'
          : '<div class="badge green">NO</div>'
        }
      </div>

      <div class="glass card">
        <div class="label">Mintable</div>
        ${
          goplus?.is_mintable==='1'
          ? '<div class="badge yellow">YES</div>'
          : '<div class="badge green">NO</div>'
        }
      </div>

      <div class="glass card">
        <div class="label">Blacklist</div>
        ${
          goplus?.is_blacklisted==='1'
          ? '<div class="badge red">YES</div>'
          : '<div class="badge green">NO</div>'
        }
      </div>

      <div class="glass card">
        <div class="label">Proxy Contract</div>
        ${
          goplus?.is_proxy==='1'
          ? '<div class="badge yellow">YES</div>'
          : '<div class="badge green">NO</div>'
        }
      </div>

    </div>

  </div>

  <div class="section">

    <h2>Top Holders</h2>

    <div class="holders">

      ${holders.map(h=>`

        <div class="holder">

          <div class="addr">
            ${h.address?.hash || '-'}
          </div>

          <div>
            ${fmtNum(Number(h.value||0))}
          </div>

        </div>

      `).join('')}

    </div>

  </div>

  `;

  const results=document.getElementById('results');

  results.innerHTML=html;

  results.style.display='block';

  lastScanResult=data;

  console.log(data);
}

</script>

</body>
</html>
